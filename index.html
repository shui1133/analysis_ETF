                            <div>投資報酬: <span class="text-yellow-300 font-bold">--</span></div>

                    </div>

                    <div class="bg-white/5 rounded-2xl p-5 border border-white/5">
                        <h4 class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-3 flex items-center">

                            <div>推估累計股利: <span class="text-green-300 font-bold">--</span></div>

                    </div>

            </div>

            <!-- 年度報表 -->

                                <th class="p-3 text-right">年度股利</th>
                                <th class="p-3 text-right">年度報酬</th>
                                <th class="p-3 text-right">年末資產</th>

    // ── 歷史統計卡 ───────────────────────────────────────────────
    function renderHistStats(stats) {
        const box = document.getElementById('histStatsBox');
        box.classList.remove('hidden');
        let html = '';
        for (const [ticker, s] of Object.entries(stats)) {
            html += `
            <div class="bg-white rounded-xl p-3 border border-slate-200 shadow-sm">
                <div class="font-bold text-slate-700 mb-1">${ticker}</div>
                <div class="text-slate-500 space-y-0.5">
                    <div>股價年化成長 (CAGR): <span class="font-bold text-blue-600">${s.cagr}%</span></div>
                    <div>平均每股股利: <span class="font-bold text-green-600">${s.avg_div_per_share} 元</span></div>
                    <div>年均配息次數: <span class="font-bold text-slate-700">${s.avg_div_times} 次</span></div>
                    <div>末日收盤價: <span class="font-bold text-slate-700">${s.last_price} 元</span></div>
                </div>
            </div>`;
        }
        document.getElementById('histStatsContent').innerHTML = html;
    }

    // ── 圖表 ─────────────────────────────────────────────────────
    function renderChart(cd) {
        const ctx = document.getElementById('fireChart');
        if (fireChart) fireChart.destroy();

        fireChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: cd.labels,
                datasets: [
                    {
                        label: '實際資產（歷史）',
                        data:  cd.actual_assets,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16,185,129,0.08)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 3,
                        spanGaps: false,
                        pointRadius: 4,
                        pointBackgroundColor: '#10b981',
                        pointHoverRadius: 6
                    },
                    {
                        label: '推估資產（歷史統計）',
                        data:  cd.forecast_assets,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99,102,241,0.07)',
                        fill: true,
                        tension: 0.4,
                        borderWidth: 2.5,
                        borderDash: [7, 4],
                        spanGaps: false,
                        pointRadius: 4,
                        pointBackgroundColor: '#6366f1',
                        pointHoverRadius: 6
                    },
                    {
                        label: '8%年化報酬（理論值）',
                        data:  cd.return_8_assets,
                        borderColor: 'rgba(245,158,11,0.35)',
                        backgroundColor: 'transparent',
                        fill: false,
                        tension: 0.3,
                        borderWidth: 1.5,
                        borderDash: [3, 5],
                        pointRadius: 0,
                        pointHoverRadius: 4,
                        pointHoverBackgroundColor: '#f59e0b'
                    },
                    {
                        label: '通膨門檻（3%）',
                        data:  cd.inflation_threshold,
                        borderColor: '#ef4444',
                        backgroundColor: 'transparent',
                        fill: false,
                        tension: 0,
                        borderWidth: 2,
                        borderDash: [5, 5],
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        pointHoverBackgroundColor: '#ef4444'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false
                },
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: function(ctx) {
                                if (ctx.parsed.y === null) return null;
                                return ctx.dataset.label + ': ' +
                                       Math.round(ctx.parsed.y).toLocaleString() + ' 元';
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: {
                            font: { size: 10 },
                            callback: v => (v / 10000).toFixed(0) + '萬'
                        },
                        max: (function() {
                            // Y 軸上限：取推估資產、通膨門檻的最大值 × 1.3
                            // 排除 8% 線，避免它把 Y 軸撐爆
                            const validSeries = [
                                ...cd.actual_assets.filter(v => v !== null),
                                ...cd.forecast_assets.filter(v => v !== null),
                                ...cd.inflation_threshold.filter(v => v !== null)
                            ];
                            if (validSeries.length === 0) return undefined;
                            return Math.ceil(Math.max(...validSeries) * 1.3 / 1000000) * 1000000;
                        })()
                    },
                    x: {
                        grid: { display: false },
                        ticks: { font: { size: 10 } }
                    }
                }
            }
        });
    }
    // ── 年度報表 ─────────────────────────────────────────────────
    function renderTable(tableData) {
        let html = '';
        for (const row of tableData) {
            const isActual   = row.data_type === 'actual';
            const rowClass   = isActual ? 'row-actual' : 'row-forecast';
            const badge      = isActual
                ? '<span class="badge-actual">實際</span>'
                : '<span class="badge-forecast">推估</span>';
            const returnVal  = row.year_return_raw;
            const returnColor = returnVal >= 0 ? 'text-blue-600' : 'text-red-500';

            html += `
            <tr class="${rowClass} border-b">
                <td class="p-3 font-medium">${row.year}</td>
                <td class="p-3 text-center">${badge}</td>
                <td class="p-3 text-right">${row.year_invested}</td>
                <td class="p-3 text-right text-green-600">${row.year_dividend}</td>
                <td class="p-3 text-right ${returnColor}">${row.year_return}</td>
                <td class="p-3 text-right font-bold">${row.year_end_assets}</td>
                <td class="p-3 text-right text-red-600">${row.inflation_threshold}</td>
            </tr>`;
        }
        document.getElementById('tableBody').innerHTML = html;
    }

    // ── ETF持倉明細表 ─────────────────────────────────────────────
    function renderETFDetails(etfDetails) {
        // 渲染表格內容但不自動展開
        let html = '';
        for (const yearData of etfDetails) {
            const year = yearData['年份'];
            const dataType = yearData['資料類型'];
            const isActual = dataType === 'actual';
            const rowClass = isActual ? 'row-actual' : 'row-forecast';
            const badge = isActual
                ? '<span class="badge-actual">實際</span>'
                : '<span class="badge-forecast">推估</span>';
            
            // 計算年度總市值
            let totalMarketValue = 0;
            for (const [ticker, detail] of Object.entries(yearData['etfs'])) {
                totalMarketValue += detail['市值'];
            }
            
            // 每支ETF一行
            let firstRow = true;
            for (const [ticker, detail] of Object.entries(yearData['etfs'])) {
                const shares = detail['持股數'];
                const price = detail['股價'];
                const marketValue = detail['市值'];
                const weight = detail['權重'];
                const weightPercent = (weight * 100).toFixed(0);
                
                // 第一行顯示年份和類型，後續行留空
                if (firstRow) {
                    html += `
                    <tr class="${rowClass} border-b">
                        <td class="p-3 font-medium" rowspan="${Object.keys(yearData['etfs']).length}">${year}</td>
                        <td class="p-3 text-center" rowspan="${Object.keys(yearData['etfs']).length}">${badge}</td>
                        <td class="p-3 font-medium">${ticker}</td>
                        <td class="p-3 text-right">${shares.toLocaleString()}</td>
                        <td class="p-3 text-right">${price.toFixed(2)}</td>
                        <td class="p-3 text-right font-bold">${marketValue.toLocaleString()}</td>
                        <td class="p-3 text-center text-blue-600">${weightPercent}%</td>
                    </tr>`;
                    firstRow = false;
                } else {
                    html += `
                    <tr class="${rowClass} border-b">
                        <td class="p-3 font-medium">${ticker}</td>
                        <td class="p-3 text-right">${shares.toLocaleString()}</td>
                        <td class="p-3 text-right">${price.toFixed(2)}</td>
                        <td class="p-3 text-right font-bold">${marketValue.toLocaleString()}</td>
                        <td class="p-3 text-center text-blue-600">${weightPercent}%</td>
                    </tr>`;
                }
            }
            
            // 年度總計行
            html += `
            <tr class="${rowClass} border-b-2 border-slate-400 font-bold bg-slate-50">
                <td colspan="5" class="p-3 text-right">年度總市值</td>
                <td class="p-3 text-right text-blue-700">${totalMarketValue.toLocaleString()}</td>
                <td class="p-3 text-center">100%</td>
            </tr>`;
        }
        
        document.getElementById('etfDetailsBody').innerHTML = html;
        
        // 顯示切換按鈕
        document.getElementById('btnToggleETFDetails').style.display = 'block';
    }

    // ── 切換ETF持倉明細表顯示 ──────────────────────────────────────
    function toggleETFDetails() {
        const section = document.getElementById('etfDetailsSection');
        const btnText = document.getElementById('btnETFDetailsText');
        
        if (section.classList.contains('collapsed')) {
            // 展開
            section.classList.remove('collapsed');
            section.classList.add('expanded');
            btnText.textContent = '隱藏ETF持倉明細';
            
            // 平滑捲動到表格位置
            setTimeout(() => {
                section.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        } else {
            // 收合
            section.classList.remove('expanded');
            section.classList.add('collapsed');
            btnText.textContent = '顯示ETF持倉明細';
        }
    }

    // ── 下載CSV ──────────────────────────────────────────────────
    function downloadCSV() {
        if (!backtestResult) { alert('請先執行回測分析'); return; }
        window.location.href = '/api/download_csv/' + currentStrategy;
    }

    // 初始化
    window.addEventListener('load', updateETFCards);
</script>
