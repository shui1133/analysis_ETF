<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣ETF投資回測分析系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .header-bg { background: linear-gradient(135deg, #0f172a 0%, #1e40af 100%); }
        .strategy-btn { cursor: pointer; padding: 12px 16px; border-radius: 12px; font-weight: bold; border: 2px solid #e2e8f0; transition: all 0.2s; text-align: left; }
        .active-btn { background-color: #2563eb; color: white; border-color: #3b82f6; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .inactive-btn { background-color: white; color: #64748b; }
        .etf-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .amount-tag-blue { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
        .amount-tag-green { background: rgba(52, 211, 153, 0.15); color: #6ee7b7; border: 1px solid rgba(52, 211, 153, 0.3); }
        .loading { display: none; }
        .loading.active { display: inline-block; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">
    <div class="max-w-7xl mx-auto bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-100">
        
        <div class="header-bg p-8 text-white text-center">
            <h1 class="text-3xl font-black italic tracking-tighter">台灣ETF投資回測分析系統 <span class="text-blue-400 text-sm font-normal not-italic ml-2">v1.0</span></h1>
            <p class="text-blue-100 mt-2 text-sm">真實歷史股價回測 • 實際配息複利 • 通膨修正分析</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 p-8">
            <div class="space-y-6">
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-200">
                    <h2 class="font-bold mb-4 text-slate-700 flex items-center"><i class="fa-solid fa-calculator mr-2 text-blue-600"></i>輸入規劃參數</h2>
                    <div class="space-y-4 text-sm">
                        <div>
                            <label class="block text-slate-500 font-bold mb-1 text-xs uppercase">目前年齡</label>
                            <input type="number" id="age" value="30" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-500 font-bold mb-1 text-xs uppercase">啟動資金 (萬元)</label>
                            <input type="number" id="start" value="100" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-500 font-bold mb-1 text-xs uppercase">每月定期定額 (萬元)</label>
                            <input type="number" id="monthly" value="3" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-slate-500 font-bold mb-1 text-xs uppercase">目標退休月領 (現值/萬元)</label>
                            <input type="number" id="spend" value="4" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="mt-6">
                        <label class="block text-slate-500 font-bold mb-3 text-xs tracking-widest uppercase">選擇投資策略</label>
                        <div class="grid grid-cols-1 gap-3">
                            <button id="btn-conservative" onclick="changeStrategy('conservative')" class="strategy-btn active-btn">
                                <div class="text-xs opacity-70">保守型 4%</div>
                                <div class="text-sm">00878+00713+00679B</div>
                            </button>
                            <button id="btn-balanced" onclick="changeStrategy('balanced')" class="strategy-btn inactive-btn">
                                <div class="text-xs opacity-70">穩健型 6%</div>
                                <div class="text-sm">00919+00929+0056</div>
                            </button>
                            <button id="btn-aggressive" onclick="changeStrategy('aggressive')" class="strategy-btn inactive-btn">
                                <div class="text-xs opacity-70">積極型 8%</div>
                                <div class="text-sm">006208+00929+00915</div>
                            </button>
                        </div>
                    </div>

                    <div class="mt-6 space-y-3">
                        <button onclick="fetchData()" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold hover:bg-indigo-700 transition">
                            <i class="fa-solid fa-download mr-2"></i>爬取股價資料
                            <span class="loading ml-2"><i class="fa-solid fa-spinner fa-spin"></i></span>
                        </button>
                        <button onclick="runBacktest()" class="w-full bg-blue-600 text-white p-3 rounded-lg font-bold hover:bg-blue-700 transition">
                            <i class="fa-solid fa-chart-line mr-2"></i>執行回測分析
                            <span class="loading ml-2"><i class="fa-solid fa-spinner fa-spin"></i></span>
                        </button>
                        <button onclick="downloadCSV()" class="w-full bg-emerald-600 text-white p-3 rounded-lg font-bold hover:bg-emerald-700 transition">
                            <i class="fa-solid fa-file-csv mr-2"></i>下載CSV報表
                        </button>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-blue-50 p-6 rounded-2xl border border-blue-100 text-center">
                        <p class="text-blue-500 text-[10px] font-bold uppercase tracking-widest">最終資產</p>
                        <h3 id="resFinalAssets" class="text-2xl font-black text-slate-800">--</h3>
                    </div>
                    <div class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 text-center">
                        <p class="text-indigo-500 text-[10px] font-bold uppercase tracking-widest">達成所需年分</p>
                        <h3 id="resYears" class="text-2xl font-black text-slate-800">--</h3>
                    </div>
                    <div class="bg-emerald-50 p-6 rounded-2xl border border-emerald-100 text-center">
                        <p class="text-emerald-500 text-[10px] font-bold uppercase tracking-widest">退休執行年齡</p>
                        <h3 id="resAge" class="text-2xl font-black text-slate-800">--</h3>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-3xl border border-slate-200">
                    <h3 class="text-lg font-bold mb-4 text-slate-700">資產累積趨勢圖</h3>
                    <div style="height: 350px; position: relative;">
                        <canvas id="fireChart"></canvas>
                    </div>
                </div>

                <div class="bg-slate-900 rounded-[2.5rem] p-8 text-white shadow-2xl">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <div>
                            <h3 class="font-black text-xl flex items-center text-blue-400">
                                <i class="fa-solid fa-layer-group mr-3"></i> 投資組合配置
                            </h3>
                            <p class="text-slate-400 text-xs mt-1" id="strategyTitle">保守型投資者</p>
                        </div>
                        <div class="text-xs bg-white/10 px-4 py-2 rounded-xl text-blue-200 border border-white/10">
                            <span id="totalInvested">累計投入: --</span>
                        </div>
                    </div>
                    
                    <div id="etfBoxes" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                        <!-- ETF卡片將由JavaScript動態生成 -->
                    </div>

                    <div class="bg-white/5 rounded-2xl p-6 border border-white/5">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center">
                            <i class="fa-solid fa-lightbulb mr-2 text-yellow-500"></i> 回測統計資訊
                        </h4>
                        <div id="backtestStats" class="text-sm text-slate-300 space-y-2">
                            <div>累計投入金額: <span class="text-blue-300 font-bold">--</span></div>
                            <div>累計收到股利: <span class="text-green-300 font-bold">--</span></div>
                            <div>投資報酬: <span class="text-yellow-300 font-bold">--</span></div>
                        </div>
                    </div>
                </div>

                <!-- 年度報表 -->
                <div class="bg-white p-6 rounded-3xl border border-slate-200">
                    <h3 class="text-lg font-bold mb-4 text-slate-700 flex items-center">
                        <i class="fa-solid fa-table mr-2 text-blue-600"></i>年度投資報表
                    </h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-slate-100 border-b-2 border-slate-300">
                                <tr>
                                    <th class="p-3 text-left">年份</th>
                                    <th class="p-3 text-right">年度投入</th>
                                    <th class="p-3 text-right">年度股利</th>
                                    <th class="p-3 text-right">年度報酬</th>
                                    <th class="p-3 text-right">年末資產</th>
                                    <th class="p-3 text-right">通膨門檻</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody">
                                <tr>
                                    <td colspan="6" class="p-6 text-center text-slate-400">請執行回測分析</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let fireChart = null;
        let currentStrategy = 'conservative';
        let backtestResult = null;

        const portfolioInfo = {
            conservative: {
                title: "保守型投資者",
                etfs: {
                    "00878": {name: "國泰永續高股息", weight: 0.40},
                    "00713": {name: "元大台灣高息低波", weight: 0.30},
                    "00679B": {name: "元大美債20年", weight: 0.30}
                }
            },
            balanced: {
                title: "穩健型投資者",
                etfs: {
                    "00919": {name: "群益台灣精選高息", weight: 0.35},
                    "00929": {name: "復華台灣科技優息", weight: 0.40},
                    "0056": {name: "元大高股息", weight: 0.25}
                }
            },
            aggressive: {
                title: "積極型投資者",
                etfs: {
                    "006208": {name: "富邦台50", weight: 0.30},
                    "00929": {name: "復華台灣科技優息", weight: 0.50},
                    "00915": {name: "凱基優選高股息30", weight: 0.20}
                }
            }
        };

        function changeStrategy(strategy) {
            currentStrategy = strategy;
            
            // 更新按鈕樣式
            document.querySelectorAll('.strategy-btn').forEach(btn => {
                btn.classList.remove('active-btn');
                btn.classList.add('inactive-btn');
            });
            document.getElementById('btn-' + strategy).classList.add('active-btn');
            
            // 更新標題
            document.getElementById('strategyTitle').innerText = portfolioInfo[strategy].title;
            
            // 更新ETF卡片
            updateETFCards();
        }

        function updateETFCards() {
            const startWan = parseFloat(document.getElementById('start').value) || 0;
            const monthlyWan = parseFloat(document.getElementById('monthly').value) || 0;
            const info = portfolioInfo[currentStrategy];
            
            let html = '';
            for (const [ticker, data] of Object.entries(info.etfs)) {
                const initAlloc = (startWan * data.weight).toFixed(1);
                const monthlyAlloc = (monthlyWan * data.weight).toFixed(2);
                
                html += `
                <div class="etf-card p-6 rounded-3xl text-center relative hover:bg-white/10 transition border border-white/10 shadow-lg">
                    <div class="text-blue-400 font-bold text-[10px] mb-2 uppercase tracking-widest italic opacity-70">權重 ${(data.weight * 100)}%</div>
                    <div class="font-black text-2xl mb-1 tracking-tighter">${ticker}</div>
                    <div class="text-xs text-slate-400 mb-3">${data.name}</div>
                    
                    <div class="space-y-2 mb-4">
                        <div class="amount-tag-blue py-2 px-3 rounded-xl text-xs font-bold">
                            首筆投入:${initAlloc} 萬
                        </div>
                        <div class="amount-tag-green py-2 px-3 rounded-xl text-xs font-bold">
                            建議月扣: ${monthlyAlloc} 萬
                        </div>
                    </div>
                </div>`;
            }
            
            document.getElementById('etfBoxes').innerHTML = html;
        }

        async function fetchData() {
            const btn = event.target;
            const loading = btn.querySelector('.loading');
            loading.classList.add('active');
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/fetch_data', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        portfolio_type: currentStrategy
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    alert('✓ ' + data.message);
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (error) {
                alert('錯誤: ' + error.message);
            } finally {
                loading.classList.remove('active');
                btn.disabled = false;
            }
        }

        async function runBacktest() {
            const btn = event.target;
            const loading = btn.querySelector('.loading');
            loading.classList.add('active');
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/backtest', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        portfolio_type: currentStrategy,
                        initial_capital: parseInt(document.getElementById('start').value),
                        monthly_investment: parseInt(document.getElementById('monthly').value),
                        current_age: parseInt(document.getElementById('age').value),
                        target_monthly_spend: parseInt(document.getElementById('spend').value)
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    backtestResult = data.result;
                    displayResults(data.result);
                    alert('✓ 回測完成！');
                } else {
                    alert('❌ ' + data.message);
                }
            } catch (error) {
                alert('錯誤: ' + error.message);
            } finally {
                loading.classList.remove('active');
                btn.disabled = false;
            }
        }

        function displayResults(result) {
            // 更新摘要卡片
            document.getElementById('resFinalAssets').innerText = 
                (result.final_assets / 10000).toFixed(0) + ' 萬';
            document.getElementById('resYears').innerText = 
                result.finish_year !== null ? result.finish_year + ' 年' : '未達成';
            document.getElementById('resAge').innerText = 
                result.finish_age !== null ? result.finish_age + ' 歲' : '--';
            
            // 更新統計資訊
            const returnAmount = result.final_assets - result.total_invested;
            const returnRate = ((returnAmount / result.total_invested) * 100).toFixed(1);
            
            document.getElementById('totalInvested').innerText = 
                `累計投入: ${(result.total_invested / 10000).toFixed(0)} 萬`;
            
            document.getElementById('backtestStats').innerHTML = `
                <div>累計投入金額: <span class="text-blue-300 font-bold">${result.total_invested.toLocaleString()} 元</span></div>
                <div>累計收到股利: <span class="text-green-300 font-bold">${result.total_dividend.toLocaleString()} 元</span></div>
                <div>投資報酬: <span class="text-yellow-300 font-bold">${returnAmount.toLocaleString()} 元 (${returnRate}%)</span></div>
            `;
            
            // 繪製圖表
            renderChart(result.chart_data);
            
            // 更新表格
            renderTable(result.table_data);
        }

        function renderChart(chartData) {
            const ctx = document.getElementById('fireChart');
            if (fireChart) fireChart.destroy();
            
            fireChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.labels,
                    datasets: [
                        { 
                            label: '實際資產累積', 
                            data: chartData.actual_assets, 
                            borderColor: '#10b981', 
                            backgroundColor: 'rgba(16, 185, 129, 0.1)', 
                            fill: true, 
                            tension: 0.4, 
                            borderWidth: 3 
                        },
                        { 
                            label: '預期資產(8%)', 
                            data: chartData.predicted_assets, 
                            borderColor: '#3b82f6', 
                            backgroundColor: 'rgba(59, 130, 246, 0.1)', 
                            fill: true, 
                            tension: 0.4, 
                            borderWidth: 2,
                            borderDash: [5, 5]
                        },
                        { 
                            label: '通膨門檻(3%)', 
                            data: chartData.inflation_threshold, 
                            borderColor: '#ef4444', 
                            borderDash: [6, 4], 
                            pointRadius: 0, 
                            borderWidth: 2 
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { 
                            display: true,
                            position: 'top'
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + 
                                           context.parsed.y.toLocaleString() + ' 元';
                                }
                            }
                        }
                    },
                    scales: { 
                        y: { 
                            grid: { color: 'rgba(0,0,0,0.05)' },
                            ticks: { 
                                font: { size: 10 },
                                callback: function(value) {
                                    return (value / 10000).toFixed(0) + '萬';
                                }
                            }
                        },
                        x: { 
                            grid: { display: false }, 
                            ticks: { font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function renderTable(tableData) {
            let html = '';
            for (const row of tableData) {
                html += `
                <tr class="border-b hover:bg-slate-50">
                    <td class="p-3">${row.year}</td>
                    <td class="p-3 text-right">${row.year_invested}</td>
                    <td class="p-3 text-right text-green-600">${row.year_dividend}</td>
                    <td class="p-3 text-right text-blue-600">${row.year_return}</td>
                    <td class="p-3 text-right font-bold">${row.year_end_assets}</td>
                    <td class="p-3 text-right text-red-600">${row.inflation_threshold}</td>
                </tr>`;
            }
            document.getElementById('tableBody').innerHTML = html;
        }

        function downloadCSV() {
            if (!backtestResult) {
                alert('請先執行回測分析');
                return;
            }
            window.location.href = '/api/download_csv/' + currentStrategy;
        }

        // 初始化
        window.addEventListener('load', () => {
            updateETFCards();
        });
    </script>
</body>
</html>
